<!--
  Samkraft – Inloggningslänk (Magic Link)
  Klistra in i: Supabase Dashboard → Authentication → Emails → "Magic Link" → Message body (HTML)
  Ämnesrad (Subject): Din inloggningslänk – Samkraft
  Variabel: {{ .ConfirmationURL }}
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f4f0;padding:32px 0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="520" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e6e4dd;">
        <tr>
          <td style="background:#1a1a1a;padding:28px 32px;">
            <span style="color:#ffffff;font-size:22px;font-weight:700;letter-spacing:0.02em;">Samkraft</span>
          </td>
        </tr>
        <tr>
          <td style="padding:36px 32px 8px 32px;">
            <h1 style="margin:0 0 16px 0;font-size:20px;color:#1a1a1a;">Logga in på Samkraft</h1>
            <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#3a3a3a;">
              Hej!<br><br>
              Klicka på knappen nedan för att logga in på ditt konto. Länken är giltig en kort stund.
            </p>
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px 0 24px 0;">
              <tr>
                <td style="border-radius:999px;background:#1a1a1a;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 30px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:999px;">
                    Logga in
                  </a>
                </td>
              </tr>
            </table>
            <p style="margin:0 0 24px 0;font-size:12px;line-height:1.5;color:#8a8a8a;word-break:break-all;">
              {{ .ConfirmationURL }}
            </p>
            <p style="margin:0 0 4px 0;font-size:13px;line-height:1.6;color:#6b6b6b;">
              Om du inte har begärt denna länk kan du bortse från meddelandet.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 28px 32px;border-top:1px solid #eeece6;">
            <p style="margin:0;font-size:14px;line-height:1.6;color:#3a3a3a;">
              Med vänliga hälsningar,<br>
              <strong>Samkraft-teamet</strong>
            </p>
          </td>
        </tr>
      </table>
      <p style="margin:16px 0 0 0;font-size:11px;color:#a8a8a8;">© Samkraft · Sverige</p>
    </td>
  </tr>
</table>
